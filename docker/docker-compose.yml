x-beacon-image: &beacon_image ${BEACON_IMAGE:-ghcr.io/glm-labs/beacon:2.2}
x-beacon-common-volumes: &beacon_common_volumes
  - beacon-data:/var/lib/beacon
  - beacon-logs:/var/log/beacon
  - ./custom_voice_providers:/usr/local/lib/beacon/voice_providers:ro

services:
  beacon:
    image: *beacon_image
    container_name: beacon
    restart: unless-stopped
    environment:
      BEACON_CONFIG_FILE: /etc/beacon/beacon.conf
      BEACON_SERVICE: web
      BEACON_RUN_MIGRATIONS: "1"
      BEACON_PORT: "8080"
      BEACON_WEB_WORKERS: "1"
      BEACON_WEB_THREADS: "4"
      BEACON_WEB_TIMEOUT: "120"
    ports:
      - "8080:8080"
    volumes: *beacon_common_volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  beacon-scheduler:
    image: *beacon_image
    container_name: beacon-scheduler
    restart: unless-stopped
    environment:
      BEACON_CONFIG_FILE: /etc/beacon/beacon.conf
      BEACON_SERVICE: scheduler
      BEACON_RUN_MIGRATIONS: "0"
    volumes: *beacon_common_volumes
    depends_on:
      beacon:
        condition: service_healthy

  beacon-telegram:
    image: *beacon_image
    container_name: beacon-telegram
    restart: unless-stopped
    environment:
      BEACON_CONFIG_FILE: /etc/beacon/beacon.conf
      BEACON_SERVICE: telegram
      BEACON_RUN_MIGRATIONS: "0"
      PYTHONUNBUFFERED: "1"
    volumes: *beacon_common_volumes
    depends_on:
      beacon:
        condition: service_healthy

  beacon-slack:
    image: *beacon_image
    container_name: beacon-slack
    restart: unless-stopped
    environment:
      BEACON_CONFIG_FILE: /etc/beacon/beacon.conf
      BEACON_SERVICE: slack
      BEACON_RUN_MIGRATIONS: "0"
      PYTHONUNBUFFERED: "1"
    volumes: *beacon_common_volumes
    depends_on:
      beacon:
        condition: service_healthy

volumes:
  beacon-data:
  beacon-logs:
