services:
  beacon:
    environment:
      BEACON_WEB_WORKERS: "4"
    volumes:
      - ./docker/beacon.postgres.conf:/etc/beacon/beacon.conf:ro
      - beacon-logs:/var/log/beacon
      - ./custom_voice_providers:/usr/local/lib/beacon/voice_providers:ro
    depends_on:
      postgres:
        condition: service_healthy

  beacon-scheduler:
    volumes:
      - ./docker/beacon.postgres.conf:/etc/beacon/beacon.conf:ro
      - beacon-logs:/var/log/beacon
      - ./custom_voice_providers:/usr/local/lib/beacon/voice_providers:ro
    depends_on:
      beacon:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: beacon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon-change-me
    volumes:
      - beacon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  beacon-postgres:
